<script>

// =============================
// VARIABLES GLOBALES
// =============================

let allQuestions = [];
let failedQuestions = [];
let currentMode = '';
let currentQuestions = [];
let currentQuestionIndex = 0;
let correctAnswersFirst = 0;
let incorrectAnswersFirst = 0;
let hasAnsweredCurrent = false;
let firstAttempt = true;

let timerInterval = null;
let timeRemaining = 120 * 60;
let questionsLimit = 85;
let questionsAnswered = 0;


// =============================
// NUEVA FUNCIÓN 🔥
// Mostrar imágenes solución
// =============================

function showSolutionImages(question) {
    const imagesContainer = document.getElementById('question-images');
    imagesContainer.innerHTML = '';

    if (!question.image_solution) return;

    let imageUrls = [];

    if (Array.isArray(question.image_solution)) {
        imageUrls = question.image_solution.filter(url => url && url.trim() !== '');
    } else if (typeof question.image_solution === 'string' && question.image_solution.trim() !== '') {
        imageUrls = question.image_solution
            .split(',')
            .map(url => url.trim())
            .filter(url => url !== '');
    }

    imageUrls.forEach(imageName => {
        const imgElement = document.createElement('img');
        imgElement.src = '/assets/images/questionscysaplus/' + imageName;
        imgElement.className = 'question-image';
        imgElement.alt = 'Imagen de solución';
        imgElement.onclick = () => openImageModal(imgElement.src);
        imagesContainer.appendChild(imgElement);
    });
}


// =============================
// CARGAR PREGUNTA
// =============================

function loadQuestion() {

    if (currentQuestionIndex >= currentQuestions.length) {
        showResults();
        return;
    }

    hasAnsweredCurrent = false;
    firstAttempt = true;

    document.getElementById('result-message').style.display = 'none';

    const question = currentQuestions[currentQuestionIndex];

    document.getElementById('current-question-num').textContent = currentQuestionIndex + 1;
    document.getElementById('question-counter').textContent =
        `de ${currentQuestions.length}`;

    // Texto pregunta
    document.getElementById('question-text').textContent =
        question.question;

    // 🔥 LIMPIAR imágenes (muy importante)
    document.getElementById('question-images').innerHTML = '';

    // Opciones
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    const isMultipleChoice = question.answer.length > 1;
    const inputType = isMultipleChoice ? 'checkbox' : 'radio';

    for (let [letter, text] of Object.entries(question.choices)) {
        const optionDiv = document.createElement('div');
        optionDiv.className = 'option';
        optionDiv.innerHTML = `
            <input type="${inputType}" id="opt${letter}" name="current-question" value="${letter}">
            <label for="opt${letter}">${text}</label>
        `;
        optionsContainer.appendChild(optionDiv);
    }

    document.querySelectorAll('.option').forEach(opt => {
        opt.classList.remove('wrong', 'correct');
    });
}


// =============================
// SIGUIENTE PREGUNTA
// =============================

function nextQuestion() {

    const question = currentQuestions[currentQuestionIndex];

    let selectedValues = [];
    const selected = document.querySelectorAll('input[name="current-question"]:checked');
    selectedValues = Array.from(selected).map(el => el.value).sort();

    if (selectedValues.length === 0) {
        alert('⚠️ Por favor selecciona una respuesta');
        return;
    }

    const correctSorted = question.answer.slice().sort();
    const isCorrect = JSON.stringify(selectedValues) === JSON.stringify(correctSorted);

    // =============================
    // MODO FÁCIL / REPASO
    // =============================

    if (currentMode === 'facil' || currentMode === 'repaso') {

        if (!hasAnsweredCurrent) {

            const resultDiv = document.getElementById('result-message');

            if (isCorrect) {

                resultDiv.textContent = '✅ ¡Correcto!';
                resultDiv.className = 'result correct';
                resultDiv.style.display = 'block';

                if (firstAttempt) correctAnswersFirst++;

                currentQuestionIndex++;
                loadQuestion();

            } else {

                resultDiv.textContent =
                    `❌ Incorrecto. La respuesta correcta es: ${question.answer.join(', ')}`;

                resultDiv.className = 'result incorrect';
                resultDiv.style.display = 'block';

                if (firstAttempt) {
                    incorrectAnswersFirst++;
                    if (!failedQuestions.find(q => q.question === question.question)) {
                        failedQuestions.push(question);
                    }
                }

                // 🔥 MOSTRAR IMÁGENES SOLUCIÓN
                showSolutionImages(question);

                selectedValues.forEach(val => {
                    const input = document.querySelector(`input[value="${val}"]`);
                    if (input) input.closest('.option').classList.add('wrong');
                });

                firstAttempt = false;
                return;
            }
        }

        return;
    }

    // =============================
    // MODO DIFÍCIL
    // =============================

    if (currentMode === 'dificil') {

        if (isCorrect) {
            correctAnswersFirst++;
            currentQuestionIndex++;
            loadQuestion();
        } else {

            const resultDiv = document.getElementById('result-message');
            resultDiv.textContent = '❌ Incorrecto. Inténtalo de nuevo.';
            resultDiv.className = 'result incorrect';
            resultDiv.style.display = 'block';

            incorrectAnswersFirst++;

            // 🔥 MOSTRAR IMÁGENES
            showSolutionImages(question);

            selectedValues.forEach(val => {
                const input = document.querySelector(`input[value="${val}"]`);
                if (input) input.closest('.option').classList.add('wrong');
            });
        }

        return;
    }

    // =============================
    // MODO EXAMEN
    // =============================

    if (currentMode === 'examen') {

        if (isCorrect) correctAnswersFirst++;
        else {
            incorrectAnswersFirst++;
            if (!failedQuestions.find(q => q.question === question.question)) {
                failedQuestions.push(question);
            }
        }

        currentQuestionIndex++;
        loadQuestion();
    }
}


// =============================
// MODAL IMÁGENES
// =============================

function openImageModal(imageSrc) {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    modal.classList.add('active');
    modalImg.src = imageSrc;
}

function closeImageModal() {
    document.getElementById('imageModal').classList.remove('active');
}

</script>
